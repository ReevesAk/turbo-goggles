<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Picadailys Email Template (Empty)</title>
</head>

<body
    style="background-color: #FFFFFF; font-family: 'Poppins', sans-serif; font-style: normal; font-weight: 400; min-height: 100vh; overflow-x: hidden; overflow-y: auto; padding-bottom: 1rem; width: 100%; position: relative;">
    <div
        style="background-image: url('https://i.postimg.cc/nc10mhSp/picadailys-horizontal-removebg.png'); background-size: 50%; background-position: center center; background-repeat: no-repeat; opacity: 0.1; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;">
    </div>
    <center>
        <img src="https://i.postimg.cc/nc10mhSp/picadailys-horizontal-removebg.png" height="200"
            alt="picadailys-horizontal-removebg" border="0" />
    </center>

    <main style="padding-inline: 15%;">
        <div class="main" style="text-align: left;">
            <p>{{message_body}}.</p>
        </div>
    </main>

    <footer style="margin-top: 3rem; padding-inline: 15%;">
        <p>For further enquiries, please contact our customer support through the following channels</p>

        <p>Email: {{email}}
            <!-- Email goes here  -->
            <span><a href=""></a></span>
        </p>
        <p>Phone: {{picadailys_phone}}
            <!-- Email goes here  -->
            <span style="font-weight: 700"></span>
        </p>

        <p style="font-style: italic; font-weight: 600; margin-top: 3rem;">Thank you for choosing Picadailys!</p>
    </footer>
</body>

</html>
